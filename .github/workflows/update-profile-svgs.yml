name: Update profile SVGs

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate heatmap SVG
        env:
          GH_USERNAME: "MiaUgljesic"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node generate.mjs

      - name: Generate projects SVG
        env:
          GH_USERNAME: "MiaUgljesic"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node generate-projects.mjs

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-jet.svg github-projects.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update profile SVGs [skip ci]" && git push)
